<!-- Ilustrasi untuk halaman login/registrasi -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" aria-label="Booking lapangan">
  <defs>
    <filter id="authShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f7faf8"/>
    </linearGradient>
  </defs>
  <rect x="10" y="30" width="180" height="150" fill="url(#cardGrad)" stroke="#e5e7eb" stroke-width="1" rx="20" filter="url(#authShadow)"/>
  <!-- Lapangan kecil di atas kartu -->
  <rect x="40" y="50" width="120" height="70" fill="rgba(14,124,91,0.10)" rx="10"/>
  <path d="M 40 85 h 120 v 20 H 40 Z" fill="none" stroke="rgba(14,124,91,0.30)" stroke-width="2"/>
  <line x1="100" y1="50" x2="100" y2="120" stroke="rgba(14,124,91,0.30)" stroke-width="2"/>
  <circle cx="100" cy="85" r="6" fill="#0e7c5b"/>
  <!-- Pemain -->
  <circle cx="100" cy="150" r="14" fill="#c9751e"/>
  <path d="M 92 164 L 96 172 L 104 164 Z" fill="none" stroke="#0e7c5b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="100" y1="160" x2="100" y2="178" stroke="#0e7c5b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 86 156 L 92 164 L 100 156 Z" fill="none" stroke="#0e7c5b" stroke-width="2" stroke-linecap="round"/>
  <circle cx="94" cy="146" r="2.5" fill="#0e7c5b"/>
  <circle cx="106" cy="146" r="2.5" fill="#0e7c5b"/>
  <!-- Langit / dekorasi -->
  <circle cx="30" cy="40" r="8" fill="#f28c28" opacity="0.9"/>
  <circle cx="170" cy="45" r="6" fill="#4ade80" opacity="0.8"/>
</svg>
