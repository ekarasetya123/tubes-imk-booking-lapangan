<!-- Ilustrasi shuttlecock (bulu tangkis) + raket kustom untuk LapanganKu -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" aria-label="Shuttlecock dan raket badminton">
  <defs>
    <filter id="sksShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="raketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f28c28"/>
      <stop offset="100%" stop-color="#c9751e"/>
    </linearGradient>
  </defs>
  <!-- Raket (di belakang) -->
  <path d="M 22 78 Q 22 40 55 30 L 62 34 Q 70 38 70 72 Q 70 90 55 80 Q 40 90 40 72 Q 28 62 22 78 Z" fill="url(#raketGrad)" stroke="#a16207" stroke-width="3" filter="url(#sksShadow)"/>
  <path d="M 50 38 Q 55 45 50 52 Q 45 45 50 38 Z" fill="#4ade80" stroke="#15803d" stroke-width="2"/>
  <!-- Shuttlecock (di depan) -->
  <path d="M 60 34 Q 66 34 66 38 Q 66 44 60 48 Q 54 44 54 38 Q 54 34 60 34 Z" fill="#f59e0b"/>
  <circle cx="60" cy="34" r="7" fill="#fca5a5" stroke="#ef4444" stroke-width="2"/>
  <line x1="60" y1="30" x2="60" y2="38" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
</svg>
