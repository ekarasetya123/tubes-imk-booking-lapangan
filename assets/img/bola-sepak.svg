<!-- Ilustrasi bola sepak kustom untuk LapanganKu -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" aria-label="Bola sepak">
  <defs>
    <radialGradient id="bolaGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#e5e7eb" />
      <stop offset="100%" stop-color="#9ca3af" />
    </radialGradient>
    <filter id="bolaShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="38" fill="url(#bolaGrad)" stroke="#d1d5db" stroke-width="2" filter="url(#bolaShadow)"/>
  <!-- Bentuk sekagen bola sepak (putih hitam sederhana, gaya flat) -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="#111827" stroke-width="5" stroke-dasharray="10 8"/>
  <circle cx="50" cy="50" r="30" fill="none" stroke="#111827" stroke-width="5" transform="rotate(60 50 50)" stroke-dasharray="10 8"/>
  <circle cx="50" cy="50" r="14" fill="#111827"/>
</svg>
