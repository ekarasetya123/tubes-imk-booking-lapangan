<!-- Ilustrasi keadaan kosong (empty state) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" aria-label="Kosong">
  <defs>
    <filter id="esShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>
  <circle cx="50" cy="42" r="24" fill="rgba(14,124,91,0.12)" stroke="#0e7c5b" stroke-width="2" filter="url(#esShadow)"/>
  <path d="M 44 46 L 50 52 L 56 46 Z" fill="none" stroke="#0e7c5b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="50" y1="52" x2="50" y2="60" stroke="#0e7c5b" stroke-width="3" stroke-linecap="round"/>
  <!-- 4 titik di sekitar -->
  <circle cx="28" cy="24" r="3" fill="#0e7c5b" opacity="0.5"/>
  <circle cx="72" cy="24" r="3" fill="#f28c28" opacity="0.5"/>
  <circle cx="22" cy="76" r="3" fill="#f28c28" opacity="0.5"/>
  <circle cx="78" cy="76" r="3" fill="#0e7c5b" opacity="0.5"/>
</svg>
